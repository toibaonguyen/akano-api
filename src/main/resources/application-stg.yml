# ========================================
# STAGING Environment Configuration
# ========================================
# All sensitive values are read from environment variables.
# Set these in your server/CI-CD pipeline, NOT in this file.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.akano: DEBUG
