# ========================================
# LOCAL Environment Configuration
# ========================================
# This profile is for local development on your machine.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.akano: DEBUG
    org.springframework.web: DEBUG
